[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # VITE_API_URL is NOT set here: add it in Netlify > Site configuration > Environment variables
  # (value = your Render URL, e.g. https://bonayon-api.onrender.com, no trailing slash, no /api/v1).

# Single-page app: every path serves index.html so /dashboard, /login ... work on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
