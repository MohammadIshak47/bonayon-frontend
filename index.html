<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Bonayon: climate-smart crop planning and risk advisory for Bangladesh." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Bonayon (বনায়ন)</title>
    <script>
      // Runs before the bundle so theme and Farmer Mode never flash. Keep in sync with PreferencesProvider.
      (function () {
        try {
          var t = localStorage.getItem('bonayon:theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var r = document.documentElement;
          if (dark) r.classList.add('dark');
          r.style.colorScheme = dark ? 'dark' : 'light';
          if (localStorage.getItem('bonayon:farmer') === 'on') r.setAttribute('data-farmer', 'on');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
